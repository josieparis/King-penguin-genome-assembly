# Image configuration
<image>
    radius = 1500p
    background = white
    dir = .
    file = circos.png
    png = yes
    svg = yes
</image>

# General settings
<<include etc/colors_fonts_patterns.conf>>
<<include etc/housekeeping.conf>>
<<include ticks.conf>>

<image>
<<include etc/image.conf>>
# now override as necessary
auto_alpha_colors*           = yes
auto_alpha_steps* = 30
angle_offset* = -85
</image>

