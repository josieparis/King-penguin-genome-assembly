# Image configuration
<image>
    radius = 1500p
    background = white
    dir = .
    file = circos.png
    png = yes
    svg = yes
</image>

# General settings
<<include etc/colors_fonts_patterns.conf>>
<<include etc/housekeeping.conf>>
<<include ticks.conf>>

<image>
<<include etc/image.conf>>
